<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover Letter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
    }
    h1 {
      color: #333;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
    .download-link {
      margin-top: 15px;
      display: inline-block;
      background: #007BFF;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
    }
    .download-link:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Cover Letter</h1>

  <!-- Embedded PDF -->
  <iframe src="documents/Cover Letter.pdf"></iframe>

  <!-- Download Link -->
  <a href="documents/Cover Letter.pdf" class="download-link" download>Download Cover Letter</a>

</body>
</html>
